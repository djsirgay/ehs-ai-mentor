name: Keep demo responsive

on:
  schedule:
    # Check periodically; free Render instances may need time to wake up.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and verify the production demo
        run: >-
          curl --fail --silent --show-error
          --connect-timeout 15
          --max-time 120
          --retry 5
          --retry-delay 10
          --retry-all-errors
          https://calpoly.sergey-ulyanov.pro/healthz
